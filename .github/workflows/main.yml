name: Candlelight

on:
  workflow_dispatch:
  push:
    branches: [prime, candlelight-v1]
    tags: ['v*']
  pull_request:
    branches: [prime]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify-and-pack:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify formatting
        run: dotnet build LightBulb.slnx --configuration Release
      - name: Test
        run: dotnet test LightBulb.Core.Tests --configuration Release --no-build --no-restore
      - name: Verify compiled UI in preview mode
        shell: pwsh
        run: |
          dotnet LightBulb/bin/Release/net10.0-windows/Candlelight.dll --preview "--capture-preview=$env:GITHUB_WORKSPACE/artifacts/ui"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled UI verification failed.' }
          Get-Content artifacts/ui/verification.txt
      - name: Publish self-contained portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: ./scripts/verify-installer.ps1 -InstallerPath (Get-ChildItem artifacts/release/*-Setup-win-x64.exe).FullName
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Candlelight-Setup-win-x64
          path: artifacts/release/*-Setup-win-x64.exe
          if-no-files-found: error
      - name: Upload portable app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Candlelight.win-x64
          path: artifacts/Candlelight.win-x64.zip
          if-no-files-found: error
      - name: Upload interface verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: interface-verification
          path: artifacts/ui/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh run download "$GITHUB_RUN_ID" --name Candlelight-Setup-win-x64 --dir release
          gh run download "$GITHUB_RUN_ID" --name Candlelight.win-x64 --dir release
          mv "release/Candlelight-$version-Setup-win-x64.exe" release/Candlelight-Setup-win-x64.exe
          mv release/Candlelight.win-x64.zip release/Candlelight-win-x64.zip
          (cd release && sha256sum Candlelight-Setup-win-x64.exe Candlelight-win-x64.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Candlelight $version" --notes-file "docs/releases/$version.md"
